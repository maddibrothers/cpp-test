<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TDM Arena C++ Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; touch-action: none; }
    #canvas { width: 100%; height: 100%; display: block; }
    #hud {
      position: absolute; top: 12px; left: 12px;
      color: #38bdf8; font-family: monospace; font-size: 12px;
      background: rgba(0, 0, 0, 0.7); padding: 8px 12px; border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.3); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">C++ WebAssembly | ACES Tone Mapping | Harsh Sun & Shadows</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      onRuntimeInitialized: function() {
        console.log("C++ Engine Initialized Successfully.");
      }
    };
  </script>
  <script src="game.js"></script>
</body>
</html>
